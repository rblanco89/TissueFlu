# =============================================================================
#  TissueFlu configuration file
# =============================================================================
#
#  Format: one "name = value" per line.  '#' starts a comment, on its own line
#  or after a value.  Names are case-sensitive; an unknown name is reported as
#  a warning.  A parameter left out takes the default built into src/params.cu,
#  so keep every parameter listed here to make a run fully documented.
#
#  Time: one simulation step is one minute (1440 steps = 1 day).
#
#  Dose-response curves: every "K_*" below is the half-maximum of a Hill curve
#      h(x) = x^n / (K^n + x^n),   n = nHill,
#  which rises from 0 (x = 0) through 1/2 (x = K) towards 1 (x >> K).
#  Probabilities are per cell and per minute.
#
#  Run with:
#      ./tissueFlu --config lung.conf --structure cells.csv --output results/
# =============================================================================


# -----------------------------------------------------------------------------
#  Simulation control
# -----------------------------------------------------------------------------
timeSteps       = 14400       # length of the run (steps = minutes); 14400 = 10 days
measureInterval = 1440        # steps between rows of tissueState_<n>.csv; 144 = 10 per day
numReplicates   = 1           # independent stochastic realisations

ranSeed         = 713000000   # replicate n uses ranSeed + n - 1 (inoculum sites,
                              #   infected-cell lifetimes, all events during the run)
# tissueSeed    = 12345       # optional: fixes WHICH cells are non-permissive, the same
                              #   in every replicate and every run with this seed.
                              #   Leave commented out to redraw them for each replicate.


# -----------------------------------------------------------------------------
#  Visual output (only written when numReplicates = 1)
# -----------------------------------------------------------------------------
printSnapshots   = 0          # 0 = none, 1 = whole tissue, 2 = infected cells only
snapshotInterval = 2880       # steps between frames of snapshots.xyz


# -----------------------------------------------------------------------------
#  Tissue
# -----------------------------------------------------------------------------
neighRadius              = 10    # cells closer than this (structure-file units) exchange
                                 #   virions and IFN; the neighbour list is cached as
                                 #   <structure>_neighbors_r<whole part of radius>.csv
nonPermissiveProbability = 0.2   # fraction of cells that can never be infected


# -----------------------------------------------------------------------------
#  Inoculum (t = 0)
# -----------------------------------------------------------------------------
numInfections  = 38      # randomly chosen cells that receive virions
initialVirions = 100     # virions placed on each of those cells


# -----------------------------------------------------------------------------
#  Shared steepness of all dose-response curves
# -----------------------------------------------------------------------------
nHill = 2                # Hill coefficient n used by every K_* curve


# -----------------------------------------------------------------------------
#  Infection of a susceptible cell
#    P(infection) = h(log10(virions + 1); K_v)
# -----------------------------------------------------------------------------
K_v = 3.770328007247293  # half-maximum, in log10(virions + 1)


# -----------------------------------------------------------------------------
#  Infected cells
#    Virion release follows a fixed time curve (virion_production in model.cu).
# -----------------------------------------------------------------------------
infectingPeriod    = 1800   # mean lifetime of an infected cell (min); each cell draws its
                            #   lifetime from a Poisson distribution in whole hours
IFNcellProbability = 0.5    # fraction of new infections able to produce IFN (IFN+ cells)

# dsRNA -> IFN circuit, IFN+ cells only
k_syn = 1.0                 # dsRNA made per virion produced
k_deg = 0.0001              # dsRNA degradation rate (1/min)
pFmax = 1.0                 # IFN production rate (IFN / min / dsRNA)


# -----------------------------------------------------------------------------
#  Extracellular transport (explicit diffusion on the neighbour network)
#    The program prints the largest stable diffusion coefficient at start-up.
# -----------------------------------------------------------------------------
virionDiffusion = 0.0017237223378120262   # virion diffusion coefficient
virionClearance = 0.00234                 # fraction of virions cleared per minute
IFNdiffusion    = 0.0882246               # IFN diffusion coefficient
IFNclearance    = 0.001                   # fraction of IFN cleared per minute
flagPorousDiff  = 0                       # 1 = porous-medium transport (moves f^2, not f)


# -----------------------------------------------------------------------------
#  Antiviral effects of IFN          (flag = 1 switches the mechanism on)
# -----------------------------------------------------------------------------
# Refractory state: a susceptible cell becomes permanently resistant
#    P(refractory) = h(log10(IFN + 1); K_r)
flagRefrac = 1
K_r        = 20.0                   # half-maximum, in log10(IFN + 1)

# Suppression: IFN lowers the chance of a new infection
#    P(infection) is multiplied by 1 - h(log10(IFN + 1); K_s)
flagSupp   = 1
K_s        = 2.3430533820631143     # half-maximum, in log10(IFN + 1)

# Blocked production (BP): IFN reduces virion release by infected cells
#    virions released are multiplied by 1 - h(IFN; K_bp)
flagBP     = 1
K_bp       = 20.0                   # half-maximum, in IFN units (linear)

# Positive feedback (PF): IFN amplifies its own production in IFN+ cells
#    IFN produced is multiplied by 1 + alpha_pf * h(IFN; K_pf)
flagPF     = 1
K_pf       = 2994.2345686232497     # half-maximum, in IFN units (linear)
alpha_pf   = 1.0                    # maximum extra amplification


# -----------------------------------------------------------------------------
#  Systemic cytotoxic T-cell (CTL) response
#    One well-mixed CTL level T for the whole tissue:
#      dT/dt = rho_T * h(mean IFN per cell; K_ifn) * T * (1 - T/T_max) - delta_T * T
#    Each infected cell is killed with P(kill) = h(T; K_T)
# -----------------------------------------------------------------------------
flagCTL = 1
K_T     = 5.0        # half-maximum of the killing probability, in CTL units
K_ifn   = 5.0        # half-maximum of CTL expansion, in mean IFN per cell
rho_T   = 0.01       # CTL expansion rate (1/min)
delta_T = 0.002      # CTL decay rate (1/min)
T0      = 1e-4       # CTL level before the infection
T_max   = 1000.0     # CTL carrying capacity
